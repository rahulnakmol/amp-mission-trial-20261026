name: Mission trial
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  contract:
    name: Trial contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify exact fixture
        run: printf 'ready\n' | cmp - status.txt
